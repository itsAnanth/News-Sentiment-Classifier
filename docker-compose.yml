version: '3.8'
services:
  app:
    build: .
    container_name: news-sentiment-classifier-app
    # Map Streamlit default port 8501 for the dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/news_sentiment_model
      - name=news-sentiment
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

    develop:
      watch:
        - action: sync
          path: .
          target: /app

